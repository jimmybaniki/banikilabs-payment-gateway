    <script type="text/babel">
const { useState, useEffect } = React;

const Icon = ({ label, className }) => (

const Smartphone = props => <Icon label="📱" {...props} />;
const Shield = props => <Icon label="🛡️" {...props} />;

// Données d'origine pour le Seeding si la table est vide
const INITIAL_USERS = {

const INITIAL_TRANSACTIONS = [
  { id: 'TX-9028', type: 'MINT_MONNAIE', sender: 'BCC (Banque Centrale)', receiver: 'Banikilabs Trésor', amount: 50000000, currency: 'FC', date: 'Aujourd\'hui, 08:30', status: 'Succès' },
  { id: 'TX-9029', type: 'MINT_MONNAIE', sender: 'BCC (Banque Centrale)', receiver: 'Banikilabs Trésor', amount: 100000, currency: 'USD', date: 'Aujourd\'hui, 08:31', status: 'Succès' },
  { id: 'TX-9030', type: 'APPRO_SUPER_AGENT', sender: 'Banikilabs Trésor', receiver: 'Super Agent Blive Kivu', amount: 10000000, currency: 'FC', date: 'Aujourd\'hui, 09:12', status: 'Succès' },
  { id: 'TX-9031', type: 'APPRO_SUPER_AGENT', sender: 'Banikilabs Trésor', receiver: 'Super Agent Blive Kivu', amount: 25000, currency: 'USD', date: 'Aujourd\'hui, 09:15', status: 'Succès' },
  { id: 'TX-9032', type: 'APPRO_AGENT', sender: 'Super Agent Blive Kivu', receiver: 'Blive Express - Kiosque #45', amount: 500000, currency: 'FC', date: 'Aujourd\'hui, 09:30', status: 'Succès' },
  { id: 'TX-9033', type: 'APPRO_AGENT', sender: 'Super Agent Blive Kivu', receiver: 'Blive Express - Kiosque #45', amount: 1500, currency: 'USD', date: 'Aujourd\'hui, 09:32', status: 'Succès' },
  { id: 'TX-9034', type: 'DEPOT', sender: 'Blive Express - Kiosque #45', receiver: 'Jean Dupont', amount: 100000, currency: 'FC', date: 'Aujourd\'hui, 10:15', status: 'Succès' },
  { id: 'TX-9035', type: 'DEPOT', sender: 'Blive Express - Kiosque #45', receiver: 'Jean Dupont', amount: 150, currency: 'USD', date: 'Aujourd\'hui, 10:18', status: 'Succès' },
  { id: 'TX-9036', type: 'ENVOI', sender: 'Jean Dupont', receiver: 'Marie Kabange', amount: 25000, currency: 'FC', date: 'Aujourd\'hui, 11:00', status: 'Succès' },
  { id: 'TX-9037', type: 'ENVOI', sender: 'Jean Dupont', receiver: 'Marie Kabange', amount: 40, currency: 'USD', date: 'Aujourd\'hui, 11:05', status: 'Succès' },
  { id: 'TX-9038', type: 'PAIEMENT_MARCHAND', sender: 'Marie Kabange', receiver: 'Alimentation du Centre & Fils', amount: 15000, currency: 'FC', date: 'Aujourd\'hui, 11:24', status: 'Succès' },
  { id: 'TX-9039', type: 'PAIEMENT_MARCHAND', sender: 'Marie Kabange', receiver: 'Alimentation du Centre & Fils', amount: 15, currency: 'USD', date: 'Aujourd\'hui, 11:26', status: 'Succès' }
];

// Configuration Supabase fournie
const SUPABASE_URL = "https://tifqpzyyqdsjqpmoksly.supabase.co";
const SUPABASE_KEY = "sb_publishable_EBS9bNt8fffPsw8CVJ5EsA_3xUY3-8X";

// Initialisation du client Supabase
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function App() { 
  const [dbConnected, setDbConnected] = useState(false);
  const [users, setUsers] = useState({});
  const [transactions, setTransactions] = useState([]);
  const [activeTab, setActiveTab] = useState('dashboard'); // dashboard | phones | register
  const [selectedUserInspector, setSelectedUserInspector] = useState('tresor'); 
  const [systemAlerts, setSystemAlerts] = useState([
    { id: 1, text: "Initialisation du cloud Supabase (Mode HTTP Polling activé)...", type: "info" }
  ]);
  
  // UI States per Phone
  const [phoneStates, setPhoneStates] = useState({
    tresor: { screen: 'home', pin: '', enteredAmount: '', enteredTarget: '', error: '', notification: null },
    superAgent: { screen: 'home', pin: '', enteredAmount: '', enteredTarget: '', error: '', notification: null },
    agent: { screen: 'home', pin: '', enteredAmount: '', enteredTarget: '', error: '', notification: null },
    merchant: { screen: 'home', pin: '', enteredAmount: '', enteredTarget: '', error: '', notification: null },
    clientA: { screen: 'home', pin: '', enteredAmount: '', enteredTarget: '', error: '', notification: null },
    clientB: { screen: 'home', pin: '', enteredAmount: '', enteredTarget: '', error: '', notification: null }
  });

  const [editUserId, setEditUserId] = useState(null);
  const [editFC, setEditFC] = useState(0);
  const [editUSD, setEditUSD] = useState(0);
  const [editPinValue, setEditPinValue] = useState('');
  const [showPins, setShowPins] = useState(false);

  const addSystemAlert = (text, type = "info") => {
    const id = Date.now();
    setSystemAlerts(prev => [{ id, text, type }, ...prev.slice(0, 11)]);
  };

  // 1. Fetching logic from Supabase DB
  const fetchUsers = async () => {
    try {
      const { data, error } = await supabase.from('users').select('*');
      if (error) throw error;
      
      const loadedUsers = {};
      data.forEach(u => {
        loadedUsers[u.user_key] = {
          id: u.id,
          role: u.role,
          name: u.name,
          phone: u.phone,
          balanceFC: parseFloat(u.balance_fc) || 0,
          balanceUSD: parseFloat(u.balance_usd) || 0,
          commissionFC: parseFloat(u.commission_fc) || 0,
          commissionUSD: parseFloat(u.commission_usd) || 0,
          status: u.status,
          code: u.code,
          merchantCode: u.merchant_code
        };
      });
      setUsers(loadedUsers);
      setDbConnected(true);
    } catch (e) {
      console.error("Erreur de récupération des utilisateurs:", e);
    }
  };

  const fetchTransactions = async () => {
    try {
      const { data, error } = await supabase
        .from('transactions')
        .select('*')
        .order('timestamp', { ascending: false });
      if (error) throw error;
      setTransactions(data);
    } catch (e) {
      console.error("Erreur de récupération des transactions:", e);
    }
  };

  // Raccourci pour rafraîchir l'ensemble de l'interface utilisateur après une action
  const triggerSync = async () => {
    await fetchUsers();
    await fetchTransactions();
  };

  // 2. Database seeding function if empty
  const seedDatabaseIfEmpty = async () => {
    try {
      const { count, error } = await supabase.from('users').select('*', { count: 'exact', head: true });
      if (error) throw error;

      if (count === 0) {
        addSystemAlert("Aucun compte trouvé. Initialisation automatique de Supabase...", "info");
        
        // Feed users
        const usersToInsert = Object.entries(INITIAL_USERS).map(([key, u]) => ({
          id: u.id,
          user_key: key,
          name: u.name,
          phone: u.phone,
          role: u.role,
          balance_fc: u.balanceFC,
          balance_usd: u.balanceUSD,
          commission_fc: u.commissionFC,
          commission_usd: u.commissionUSD,
          status: u.status,
          code: u.code,
          merchant_code: u.merchantCode || null
        }));

        const { error: userSeedError } = await supabase.from('users').insert(usersToInsert);
        if (userSeedError) throw userSeedError;

        // Feed transactions
        const txsToInsert = INITIAL_TRANSACTIONS.map((tx, idx) => ({
          id: tx.id,
          type: tx.type,
          sender: tx.sender,
          receiver: tx.receiver,
          amount: tx.amount,
          currency: tx.currency,
          fees: tx.fees || 0,
          date: tx.date,
          status: tx.status,
          timestamp: Date.now() - (idx * 60000)
        }));

        const { error: txSeedError } = await supabase.from('transactions').insert(txsToInsert);
        if (txSeedError) throw txSeedError;

        addSystemAlert("Supabase initialisé avec succès !", "success");
      }
      
      await triggerSync();
    } catch (e) {
      console.error("Échec du seeding initial:", e);
    }
  };

  // 3. Setup polling intervals to query Supabase (WebSocket fallback secure mode)
  useEffect(() => {
    // Initial connection
    seedDatabaseIfEmpty();

    // Au lieu d'utiliser WebSocket (qui est bloqué dans Canvas),
    // nous utilisons un système de polling rapide et stable toutes les 2.5 secondes.
    const syncInterval = setInterval(() => {
      fetchUsers();
      fetchTransactions();
    }, 2500);

    addSystemAlert("Mode sécurisé HTTP Polling actif. Données synchronisées toutes les 2.5s.", "success");

    return () => {
      clearInterval(syncInterval);
    };
  }, []);

  const triggerSMS = (userKey, text) => {
    setPhoneStates(prev => ({
      ...prev,
      [userKey]: {
        ...prev[userKey],
        notification: {
          id: Date.now(),
          text: text
        }
      }
    }));
    setTimeout(() => {
      setPhoneStates(prev => ({
        ...prev,
        [userKey]: { ...prev[userKey], notification: null }
      }));
    }, 7000);
  };

  const startEditing = (userKey, fc, usd, pin) => {
    setEditUserId(userKey);
    setEditFC(fc);
    setEditUSD(usd);
    setEditPinValue(pin);
  };

  // Safe Supabase writers
  const writeUserDoc = async (userKey, updatedData) => {
    const dbData = {};
    if (updatedData.code !== undefined) dbData.code = updatedData.code;
    if (updatedData.balanceFC !== undefined) dbData.balance_fc = updatedData.balanceFC;
    if (updatedData.balanceUSD !== undefined) dbData.balance_usd = updatedData.balanceUSD;
    if (updatedData.commissionFC !== undefined) dbData.commission_fc = updatedData.commissionFC;
    if (updatedData.commissionUSD !== undefined) dbData.commission_usd = updatedData.commissionUSD;
    if (updatedData.status !== undefined) dbData.status = updatedData.status;

    try {
      const { error } = await supabase
        .from('users')
        .update(dbData)
        .eq('user_key', userKey);
      if (error) throw error;
      
      // Force instant local sync
      await triggerSync();
    } catch (e) {
      console.error("Erreur de mise à jour Supabase:", e);
      addSystemAlert("Erreur de sauvegarde Supabase.", "warning");
    }
  };

  const writeTxDoc = async (txObj) => {
    try {
      const { error } = await supabase.from('transactions').insert([{
        id: txObj.id,
        type: txObj.type,
        sender: txObj.sender,
        receiver: txObj.receiver,
        amount: txObj.amount,
        currency: txObj.currency,
        fees: txObj.fees || 0,
        date: txObj.date,
        status: txObj.status,
        timestamp: Date.now()
      }]);
      if (error) throw error;
      
      // Force instant local sync
      await triggerSync();
    } catch (e) {
      console.error("Erreur insertion transaction Supabase:", e);
    }
  };

  const saveBalances = async (userKey) => {
    const updatedFields = {
      code: editPinValue,
      balanceFC: parseFloat(editFC) || 0,
      balanceUSD: parseFloat(editUSD) || 0
    };
    await writeUserDoc(userKey, updatedFields);
    addSystemAlert(`Soldes mis à jour pour ${users[userKey]?.name}`, "info");
    setEditUserId(null);
  };

  const toggleUserStatus = async (userKey) => {
    const u = users[userKey];
    if (!u) return;
    const newStatus = u.status === 'Actif' ? 'Bloqué' : 'Actif';
    await writeUserDoc(userKey, { status: newStatus });
    addSystemAlert(`L'utilisateur ${u.name} est désormais ${newStatus}.`, newStatus === 'Bloqué' ? "warning" : "success");
  };

  const handleRegisterUser = async (formData) => {
    const { name, phone, pin } = formData;
    const userKey = `user_${Date.now()}`;
    const newUser = {
      id: `CL_${Math.floor(1000 + Math.random() * 9000)}`,
      user_key: userKey,
      role: 'client',
      name: name,
      phone: phone,
      balance_fc: 0,
      balance_usd: 0,
      status: 'Actif',
      code: pin
    };
    
    try {
      const { error } = await supabase.from('users').insert([newUser]);
      if (error) throw error;
      addSystemAlert(`Nouvel utilisateur enregistré : ${name} (${phone})`, "success");
      await triggerSync();
      setActiveTab('dashboard');
    } catch (e) {
      console.error("Erreur d'inscription Supabase:", e);
      addSystemAlert("Erreur de création de compte sur le Cloud.", "warning");
    }
  };

  // Exclusive Admin/Treasury Action: Money Minting
  const handleTresorMintMoney = async (amount, currency, pin) => {
    const amt = parseFloat(amount);
    const tresor = users.tresor;
    if (!tresor) return { success: false, msg: "Trésor non initialisé." };
    if (!amt || amt <= 0) return { success: false, msg: "Montant invalide." };
    if (tresor.status !== 'Actif') return { success: false, msg: "Action impossible : Trésor bloqué." };
    if (tresor.code !== pin) return { success: false, msg: "Code PIN Trésor incorrect." };

    const updatedBalance = currency === 'FC' 
      ? tresor.balanceFC + amt 
      : tresor.balanceUSD + amt;

    const fieldsToUpdate = currency === 'FC' 
      ? { balanceFC: updatedBalance } 
      : { balanceUSD: updatedBalance };

    await writeUserDoc('tresor', fieldsToUpdate);

    const newTx = {
      id: generateTxId(),
      type: 'MINT_MONNAIE',
      sender: 'BCC (Banque Centrale)',
      receiver: 'Vodacom Trésor',
      amount: amt,
      currency: currency,
      date: 'À l\'instant',
      status: 'Succès'
    };
    await writeTxDoc(newTx);

    triggerSMS('tresor', `Blive : Création de monnaie réussie. +${amt.toLocaleString()} ${currency} injectés dans le Trésor Banikilabs.`);
    addSystemAlert(`Frappe Monétaire : Vodacom Trésor a émis ${amt.toLocaleString()} ${currency} de monnaie électronique.`, "success");

    return { success: true };
  };

  // Treasury Supplies Global Float to Super Agent
  const handleTresorSupplySuperAgent = async (amount, currency, pin) => {
    const amt = parseFloat(amount);
    const tresor = users.tresor;
    const superAgent = users.superAgent;
    if (!tresor || !superAgent) return { success: false, msg: "Utilisateurs non initialisés." };
    if (tresor.status !== 'Actif') return { success: false, msg: "Action impossible : Trésor bloqué." };
    if (!amt || amt <= 0) return { success: false, msg: "Montant invalide." };
    if (tresor.code !== pin) return { success: false, msg: "Code PIN Trésor incorrect." };

    if (currency === 'FC') {
      if (tresor.balanceFC < amt) return { success: false, msg: "Solde FC insuffisant dans le Trésor." };
      await writeUserDoc('tresor', { balanceFC: tresor.balanceFC - amt });
      await writeUserDoc('superAgent', { balanceFC: superAgent.balanceFC + amt });
    } else {
      if (tresor.balanceUSD < amt) return { success: false, msg: "Solde USD insuffisant dans le Trésor." };
      await writeUserDoc('tresor', { balanceUSD: tresor.balanceUSD - amt });
      await writeUserDoc('superAgent', { balanceUSD: superAgent.balanceUSD + amt });
    }

    const newTx = {
      id: generateTxId(),
      type: 'APPRO_SUPER_AGENT',
      sender: tresor.name,
      receiver: superAgent.name,
      amount: amt,
      currency: currency,
      date: 'À l\'instant',
      status: 'Succès'
    };
    await writeTxDoc(newTx);

    triggerSMS('tresor', `Blive : Transfert de float de ${amt.toLocaleString()} ${currency} au Super Agent réussi.`);
    triggerSMS('superAgent', `Blive : Votre réserve globale a été créditée de ${amt.toLocaleString()} ${currency} par le Trésor.`);
    addSystemAlert(`Mise à disposition Float : Trésor a transféré ${amt.toLocaleString()} ${currency} au Super Agent Kivu.`, "info");

    return { success: true };
  };

  // Super Agent Supplies Agent with Kiosk Float
  const handleSuperAgentSupplyAgent = async (amount, currency, superPin) => {
    const amt = parseFloat(amount);
    const superAgent = users.superAgent;
    const agent = users.agent;
    if (!superAgent || !agent) return { success: false, msg: "Utilisateurs non configurés." };
    if (superAgent.status !== 'Actif') return { success: false, msg: "Action impossible : Super Agent bloqué." };
    if (agent.status !== 'Actif') return { success: false, msg: "Action impossible : Agent bloqué." };
    if (!amt || amt <= 0) return { success: false, msg: "Montant invalide." };
    if (superAgent.code !== superPin) return { success: false, msg: "Code PIN Super Agent incorrect." };

    if (currency === 'FC') {
      if (superAgent.balanceFC < amt) return { success: false, msg: "Solde Float FC insuffisant chez le Super Agent." };
      await writeUserDoc('superAgent', { balanceFC: superAgent.balanceFC - amt });
      await writeUserDoc('agent', { balanceFC: agent.balanceFC + amt });
    } else {
      if (superAgent.balanceUSD < amt) return { success: false, msg: "Solde Float USD insuffisant chez le Super Agent." };
      await writeUserDoc('superAgent', { balanceUSD: superAgent.balanceUSD - amt });
      await writeUserDoc('agent', { balanceUSD: agent.balanceUSD + amt });
    }

    const newTx = {
      id: generateTxId(),
      type: 'APPRO_AGENT',
      sender: superAgent.name,
      receiver: agent.name,
      amount: amt,
      currency: currency,
      date: 'À l\'instant',
      status: 'Succès'
    };
    await writeTxDoc(newTx);

    triggerSMS('superAgent', `Blive SuperAgent : Transfert de float de ${amt.toLocaleString()} ${currency} à l'Agent réussi.`);
    triggerSMS('agent', `Blive Agent : Votre compte a été approvisionné de ${amt.toLocaleString()} ${currency} par le Super Agent.`);
    addSystemAlert(`Approvisionnement Agent : Super Agent a transféré ${amt.toLocaleString()} ${currency} de Float à l'Agent Kiosque #45.`, "success");

    return { success: true };
  };

  // Client to Client Direct Transfer
  const handleClientSendMoney = async (senderKey, receiverKey, amount, currency, pin) => {
    const amt = parseFloat(amount);
    const sender = users[senderKey];
    const receiver = users[receiverKey];
    const superAgent = users.superAgent;
    const agent = users.agent;

    if (!sender || !receiver || !superAgent || !agent) return { success: false, msg: "Base de données non prête." };
    if (sender.status !== 'Actif') return { success: false, msg: "Action impossible : Votre compte est bloqué." };
    if (receiver.status !== 'Actif') return { success: false, msg: "Action impossible : Destinataire bloqué." };
    if (!amt || amt <= 0) return { success: false, msg: "Montant invalide." };
    if (sender.code !== pin) return { success: false, msg: "Code PIN incorrect." };

    // Standard simulated M-Pesa fee (1%)
    const fees = Math.round(amt * 0.01 * 100) / 100;
    const totalDeduction = amt + fees;

    if (currency === 'FC') {
      if (sender.balanceFC < totalDeduction) return { success: false, msg: `Solde FC insuffisant (Frais: ${fees} FC).` };
      await writeUserDoc(senderKey, { balanceFC: sender.balanceFC - totalDeduction });
      await writeUserDoc(receiverKey, { balanceFC: receiver.balanceFC + amt });
      
      // Share service commission fees (60% Super Agent, 40% Agent)
      await writeUserDoc('superAgent', { commissionFC: superAgent.commissionFC + Math.round(fees * 0.6) });
      await writeUserDoc('agent', { commissionFC: agent.commissionFC + Math.round(fees * 0.4) });
    } else {
      if (sender.balanceUSD < totalDeduction) return { success: false, msg: `Solde USD insuffisant (Frais: ${fees} USD).` };
      await writeUserDoc(senderKey, { balanceUSD: sender.balanceUSD - totalDeduction });
      await writeUserDoc(receiverKey, { balanceUSD: receiver.balanceUSD + amt });
      
      await writeUserDoc('superAgent', { commissionUSD: superAgent.commissionUSD + Math.round(fees * 0.6 * 100) / 100 });
      await writeUserDoc('agent', { commissionUSD: agent.commissionUSD + Math.round(fees * 0.4 * 100) / 100 });
    }

    const newTx = {
      id: generateTxId(),
      type: 'ENVOI',
      sender: sender.name,
      receiver: receiver.name,
      amount: amt,
      currency: currency,
      fees: fees,
      date: 'À l\'instant',
      status: 'Succès'
    };
    await writeTxDoc(newTx);

    triggerSMS(senderKey, `Blive : Vous avez envoyé ${amt.toLocaleString()} ${currency} à ${receiver.name}. Frais: ${fees} ${currency}. Réf: ${newTx.id}`);
    triggerSMS(receiverKey, `Blive Réception : Vous avez reçu ${amt.toLocaleString()} ${currency} de ${sender.name}. Réf: ${newTx.id}`);
    addSystemAlert("Transaction Client : " + sender.name + " a envoyé " + amt.toLocaleString() + " " + currency + " à " + receiver.name + ".", "info");

    return { success: true };
  };

  // Pay registered Merchant
  const handlePayMerchant = async (senderKey, merchantCode, amount, currency, pin) => {
    const amt = parseFloat(amount);
    const sender = users[senderKey];
    
    const merchantKey = Object.keys(users).find(k => users[k].merchantCode === merchantCode);
    if (!merchantKey) return { success: false, msg: "Code Marchand introuvable." };
    if (sender.status !== 'Actif') return { success: false, msg: "Action impossible : Votre compte est bloqué." };
    
    const merchant = users[merchantKey];
    const superAgent = users.superAgent;
    const agent = users.agent;
    const tresor = users.tresor;

    if (!merchant || !superAgent || !agent || !tresor) return { success: false, msg: "Chargement..." };
    if (!amt || amt <= 0) return { success: false, msg: "Montant invalide." };
    if (sender.code !== pin) return { success: false, msg: "Code PIN incorrect." };

    // Customers pay no fee. Merchants undergo a 0.5% deduction.
    const merchantServiceFee = Math.round(amt * 0.005 * 100) / 100;
    const netAmount = amt - merchantServiceFee;

    if (currency === 'FC') {
      if (sender.balanceFC < amt) return { success: false, msg: "Solde FC insuffisant." };
      await writeUserDoc(senderKey, { balanceFC: sender.balanceFC - amt });
      await writeUserDoc(merchantKey, { balanceFC: merchant.balanceFC + netAmount });
      
      // Distribute merchant commission across network actors
      await writeUserDoc('superAgent', { commissionFC: superAgent.commissionFC + Math.round(merchantServiceFee * 0.5) });
      await writeUserDoc('agent', { commissionFC: agent.commissionFC + Math.round(merchantServiceFee * 0.3) });
      await writeUserDoc('tresor', { commissionFC: tresor.commissionFC + Math.round(merchantServiceFee * 0.2) });
    } else {
      if (sender.balanceUSD < amt) return { success: false, msg: "Solde USD insuffisant." };
      await writeUserDoc(senderKey, { balanceUSD: sender.balanceUSD - amt });
      await writeUserDoc(merchantKey, { balanceUSD: merchant.balanceUSD + netAmount });
      
      await writeUserDoc('superAgent', { commissionUSD: superAgent.commissionUSD + Math.round(merchantServiceFee * 0.5 * 100) / 100 });
      await writeUserDoc('agent', { commissionUSD: agent.commissionUSD + Math.round(merchantServiceFee * 0.3 * 100) / 100 });
      await writeUserDoc('tresor', { commissionUSD: tresor.commissionUSD + Math.round(merchantServiceFee * 0.2 * 100) / 100 });
    }

    const newTx = {
      id: generateTxId(),
      type: 'PAIEMENT_MARCHAND',
      sender: sender.name,
      receiver: merchant.name,
      amount: amt,
      currency: currency,
      date: 'À l\'instant',
      status: 'Succès'
    };
    await writeTxDoc(newTx);

    triggerSMS(senderKey, `Blive : Paiement de ${amt.toLocaleString()} ${currency} chez ${merchant.name} effectué.`);
    triggerSMS(merchantKey, `Blive Marchand : Paiement reçu de ${sender.name}. Brut: ${amt} ${currency}, Net: ${netAmount} ${currency}.`);
    addSystemAlert("Achat Marchand : " + sender.name + " a réglé " + amt.toLocaleString() + " " + currency + " chez " + merchant.name + ".", "success");

    return { success: true };
  };

  // Agent performs physical cash deposit (Cash-In) for a customer
  const handleAgentCashIn = async (clientPhone, amount, currency, agentPin) => {
    const amt = parseFloat(amount);
    const agent = users.agent;
    if (!agent) return { success: false, msg: "Agent non disponible." };
    if (agent.status !== 'Actif') return { success: false, msg: "Action impossible : Agent bloqué." };
    if (agent.code !== agentPin) return { success: false, msg: "Code PIN Agent incorrect." };
    if (!amt || amt <= 0) return { success: false, msg: "Montant invalide." };

    const clientKey = Object.keys(users).find(k => users[k].phone === clientPhone);
    if (!clientKey) return { success: false, msg: "Client introuvable." };
    const client = users[clientKey];
    if (client.status !== 'Actif') return { success: false, msg: "Action impossible : Compte client bloqué." };

    // Commission offered to Agent by Vodacom (1.5%)
    const agentComm = Math.round(amt * 0.015 * 100) / 100;

    if (currency === 'FC') {
      if (agent.balanceFC < amt) return { success: false, msg: "Solde float FC de l'agent insuffisant." };
      await writeUserDoc('agent', { 
        balanceFC: agent.balanceFC - amt,
        commissionFC: agent.commissionFC + agentComm
      });
      await writeUserDoc(clientKey, { balanceFC: client.balanceFC + amt });
    } else {
      if (agent.balanceUSD < amt) return { success: false, msg: "Solde float USD de l'agent insuffisant." };
      await writeUserDoc('agent', { 
        balanceUSD: agent.balanceUSD - amt,
        commissionUSD: agent.commissionUSD + agentComm
      });
      await writeUserDoc(clientKey, { balanceUSD: client.balanceUSD + amt });
    }

    const newTx = {
      id: generateTxId(),
      type: 'DEPOT',
      sender: agent.name,
      receiver: client.name,
      amount: amt,
      currency: currency,
      date: 'À l\'instant',
      status: 'Succès'
    };
    await writeTxDoc(newTx);

    triggerSMS('agent', `Blive Agent : Dépôt de ${amt.toLocaleString()} ${currency} réussi pour ${client.name}.`);
    triggerSMS(clientKey, `Blive : Votre compte a été rechargé de ${amt.toLocaleString()} ${currency} par l'Agent ${agent.name}.`);
    addSystemAlert("Dépôt Agent : Kiosque a rechargé le compte de " + client.name + " avec " + amt.toLocaleString() + " " + currency + ".", "info");

    return { success: true };
  };

  // Agent processes physical cash withdrawal (Cash-Out) for a client
  const handleAgentCashOut = async (clientPhone, amount, currency, agentPin) => {
    const amt = parseFloat(amount);
    const agent = users.agent;
    const superAgent = users.superAgent;
    const tresor = users.tresor;

    if (!agent || !superAgent || !tresor) return { success: false, msg: "Chargement du réseau..." };
    if (agent.status !== 'Actif') return { success: false, msg: "Action impossible : Agent bloqué." };
    if (agent.code !== agentPin) return { success: false, msg: "Code PIN Agent incorrect." };
    if (!amt || amt <= 0) return { success: false, msg: "Montant invalide." };

    const clientKey = Object.keys(users).find(k => users[k].phone === clientPhone);
    if (!clientKey) return { success: false, msg: "Client non trouvé." };
    const client = users[clientKey];
    if (client.status !== 'Actif') return { success: false, msg: "Action impossible : Compte client bloqué." };

    // Standard cash withdrawal charge (2%)
    const clientWithdrawFees = Math.round(amt * 0.02 * 100) / 100;
    const totalClientCost = amt + clientWithdrawFees;

    // Split fees: 50% Agent, 40% Super Agent, 10% Treasury
    const agentComm = Math.round(clientWithdrawFees * 0.5 * 100) / 100;
    const superAgentComm = Math.round(clientWithdrawFees * 0.4 * 100) / 100;
    const tresorComm = Math.round(clientWithdrawFees * 0.1 * 100) / 100;

    if (currency === 'FC') {
      if (client.balanceFC < totalClientCost) {
        return { success: false, msg: `Le client a un solde insuffisant (${client.balanceFC.toLocaleString()} FC) pour retirer ${amt.toLocaleString()} FC.` };
      }
      await writeUserDoc(clientKey, { balanceFC: client.balanceFC - totalClientCost });
      await writeUserDoc('agent', { 
        balanceFC: agent.balanceFC + amt,
        commissionFC: agent.commissionFC + agentComm
      });
      await writeUserDoc('superAgent', { commissionFC: superAgent.commissionFC + superAgentComm });
      await writeUserDoc('tresor', { commissionFC: tresor.commissionFC + tresorComm });
    } else {
      if (client.balanceUSD < totalClientCost) {
        return { success: false, msg: `Le client a un solde insuffisant (${client.balanceUSD.toLocaleString()} USD) pour retirer ${amt.toLocaleString()} USD.` };
      }
      await writeUserDoc(clientKey, { balanceUSD: client.balanceUSD - totalClientCost });
      await writeUserDoc('agent', { 
        balanceUSD: agent.balanceUSD + amt,
        commissionUSD: agent.commissionUSD + agentComm
      });
      await writeUserDoc('superAgent', { commissionUSD: superAgent.commissionUSD + superAgentComm });
      await writeUserDoc('tresor', { commissionUSD: tresor.commissionUSD + tresorComm });
    }

    const newTx = {
      id: generateTxId(),
      type: 'RETRAIT',
      sender: client.name,
      receiver: agent.name,
      amount: amt,
      currency: currency,
      date: 'À l\'instant',
      status: 'Succès'
    };
    await writeTxDoc(newTx);

    triggerSMS(clientKey, `Blive : Retrait de ${amt.toLocaleString()} ${currency} réussi chez ${agent.name}.`);
    triggerSMS('agent', `Blive Agent : Retrait de ${amt.toLocaleString()} ${currency} par ${client.name} validé.`);
    addSystemAlert("Retrait d'Espèces : " + client.name + " a retiré " + amt.toLocaleString() + " " + currency + " au Kiosque #45.", "warning");

    return { success: true };
  };

  // Generate automated random demo transactions in real-time
  const handleSimulateRandomTx = () => {
    const isUSD = Math.random() > 0.5;
    const currency = isUSD ? 'USD' : 'FC';
    const amount = isUSD ? Math.floor(5 + Math.random() * 45) : Math.floor(5000 + Math.random() * 20000);

    if (Math.random() > 0.5) {
      handleClientSendMoney('clientA', 'clientB', amount, currency, '1234');
    } else {
      handlePayMerchant('clientB', '882211', amount, currency, '5678');
    }
  };

  // Prevent loading crashes if database has not returned values yet
  if (Object.keys(users).length === 0) {
    return (
      <div className="min-h-screen bg-black text-white flex flex-col justify-center items-center">
        <div className="w-12 h-12 border-4 border-yellow-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p className="text-sm font-semibold tracking-wider text-slate-400">CONNEXION À LA BASE DE DONNÉES SUPABASE...</p>
        <p className="text-xs text-slate-600 mt-2">Instantané URL : {SUPABASE_URL}</p>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-black text-white flex flex-col font-sans antialiased">
      {/* HEADER */}
      <header className="border-b border-gray-800 bg-black/85 backdrop-blur sticky top-0 z-50 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
        <div className="flex items-center space-x-3">
          <div className="w-10 h-10 rounded-xl bg-yellow-500 flex items-center justify-center font-bold text-black shadow-lg shadow-yellow-900/40">
            B
          </div>
          <div>
            <h1 className="text-xl font-extrabold tracking-tight text-white flex items-center gap-2"> 
              Banikilabs Blive <span className="text-[10px] bg-yellow-500/25 text-yellow-400 border border-yellow-500/40 px-2.5 py-0.5 rounded-full font-bold">MULTIDEVISES SUPABASE</span>
            </h1>
            <p className="text-xs text-slate-400">Écosystème Congolais (USD / FC) • Sync Cloud Réseau Supabase via Polling HTTP</p>
          </div>
        </div>

        {/* Tab Navigation */}
        <div className="flex items-center space-x-2 bg-slate-850 p-1 rounded-xl border border-slate-700/60">
          <button 
            onClick={() => setActiveTab('dashboard')}
            className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all duration-200 flex items-center gap-2 ${activeTab === 'dashboard' ? 'bg-yellow-500 text-black shadow-md' : 'text-gray-300 hover:text-white hover:bg-gray-700/50'}`}
          >
            <Activity className="w-4 h-4" />
            Supervision Réseau
          </button>
          <button 
            onClick={() => setActiveTab('phones')}
            className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all duration-200 flex items-center gap-2 ${activeTab === 'phones' ? 'bg-yellow-500 text-black shadow-md' : 'text-gray-300 hover:text-white hover:bg-gray-700/50'}`}
          >
            <Smartphone className="w-4 h-4" />
            Les 6 Terminaux Connectés
          </button>
          <button 
            onClick={() => setActiveTab('register')}
            className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all duration-200 flex items-center gap-2 ${activeTab === 'register' ? 'bg-yellow-500 text-black shadow-md' : 'text-gray-300 hover:text-white hover:bg-gray-700/50'}`}
          >
            <PlusCircle className="w-4 h-4" />
            Ouvrir un Compte
          </button>
        </div>

        {/* Global Controls */}
        <div className="flex items-center gap-3">
          {dbConnected && (
            <span className="flex items-center gap-1.5 text-xs text-emerald-400 font-mono bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20">
              <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              Supabase Polling Actif
            </span>
          )}
          <button
            onClick={handleSimulateRandomTx}
            className="px-3.5 py-1.5 rounded-lg text-xs bg-yellow-500 hover:bg-yellow-400 text-black font-medium flex items-center gap-1.5 transition-colors border border-yellow-400/40 shadow-sm"
          >
            <Sparkles className="w-3.5 h-3.5" />
            Simuler Flux (USD/FC)
          </button>
        </div>
      </header>

      {/* MAIN CONTAINER */}
      <main className="flex-1 p-6 flex flex-col gap-6 max-w-[1700px] mx-auto w-full">
        
        {/* TAB 1: NETWORK MONITOR / SUPERVISION */}
        {activeTab === 'dashboard' && (
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            {/* Left Column: Metrics & Global Directory */}
            <div className="lg:col-span-8 flex flex-col gap-6">
              
              {/* Cloud Member Directory */}
              <div className="bg-gray-900 rounded-2xl border border-gray-800 p-6">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-lg font-bold text-white flex items-center gap-2">
                    <Users className="w-5 h-5 text-indigo-400" /> Annuaire Global du Réseau (Données Supabase)
                  </h2>
                  <span className="text-[10px] bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 py-1 rounded-full font-bold">
                    {Object.keys(users).length} MEMBRES ACTIFS
                  </span>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-left">
                    <thead>
                      <tr className="text-[10px] text-slate-500 uppercase tracking-widest border-b border-gray-800">
                        <th className="py-3 px-4">Utilisateur</th>
                        <th className="py-3 px-4">Rôle</th>
                        <th className="py-3 px-4">Téléphone</th>
                        <th className="py-3 px-4 text-center">
                          <div className="flex items-center justify-center gap-1">
                            PIN
                            <button 
                              onClick={() => setShowPins(!showPins)} 
                              className="p-1 hover:bg-gray-800 rounded transition-colors text-slate-500 hover:text-yellow-500"
                              title={showPins ? "Masquer" : "Afficher"}
                            >
                              {showPins ? <Key className="w-3 h-3" /> : <Shield className="w-3 h-3" />}
                            </button>
                          </div>
                        </th>
                        <th className="py-3 px-4 text-right">Solde CDF</th>
                        <th className="py-3 px-4 text-right">Solde USD</th>
                        <th className="py-3 px-4 text-center">Statut</th>
                        <th className="py-3 px-4 text-right">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-gray-800/40">
                      {Object.entries(users).map(([userKey, u]) => (
                        <tr key={u.id || userKey} className="hover:bg-white/5 transition-colors group items-center">
                          <td className="py-3 px-4 font-bold text-slate-200 group-hover:text-yellow-500 transition-colors">{u.name}</td>
                          <td className="py-3 px-4">
                            <span className="text-[9px] bg-slate-800 px-2 py-0.5 rounded text-slate-400 uppercase font-black">{u.role}</span>
                          </td>
                          <td className="py-3 px-4 font-mono text-xs text-slate-400">{u.phone}</td>
                          <td className="py-3 px-4 text-center font-mono">
                            {editUserId === userKey ? (
                              <input 
                                type={showPins ? "text" : "password"} 
                                maxLength={4}
                                value={editPinValue} 
                                onChange={e => setEditPinValue(e.target.value)}
                                className="bg-black border border-gray-700 w-16 p-1 text-center text-[10px] rounded focus:border-yellow-500 outline-none"
                              />
                            ) : (
                              showPins ? u.code : "****"
                            )}
                          </td>
                          <td className="py-3 px-4 text-right font-bold">
                            {editUserId === userKey ? (
                              <input 
                                type="number" 
                                value={editFC} 
                                onChange={e => setEditFC(e.target.value)}
                                className="bg-black border border-gray-700 w-24 p-1 text-right text-[10px] rounded focus:border-yellow-500 outline-none"
                              />
                            ) : (
                              (u.balanceFC || 0).toLocaleString()
                            )}
                            <span className="text-slate-600 text-[10px] ml-1">FC</span>
                          </td>
                          <td className="py-3 px-4 text-right font-bold text-emerald-500">
                            {editUserId === userKey ? (
                              <input 
                                type="number" 
                                value={editUSD} 
                                onChange={e => setEditUSD(e.target.value)}
                                className="bg-black border border-emerald-900 w-20 p-1 text-right text-[10px] rounded text-emerald-400 focus:border-emerald-500 outline-none"
                              />
                            ) : (
                              (u.balanceUSD || 0).toLocaleString()
                            )}
                            <span className="text-slate-600 text-[10px] ml-1">$</span>
                          </td>
                          <td className="py-3 px-4 text-center">
                            <span className={`text-[8px] px-2 py-0.5 rounded font-black ${u.status === 'Actif' ? 'bg-emerald-500/10 text-emerald-500' : 'bg-red-500/10 text-red-500'}`}>
                              {u.status}
                            </span>
                          </td>
                          <td className="py-3 px-4 text-right flex justify-end gap-2">
                            {editUserId === userKey ? (
                              <button 
                                onClick={() => saveBalances(userKey)}
                                className="text-[9px] font-bold px-2 py-1 rounded bg-yellow-500 text-black hover:bg-yellow-400 transition-colors"
                              >
                                Sauver
                              </button>
                            ) : (
                              <button
                                onClick={() => startEditing(userKey, u.balanceFC, u.balanceUSD, u.code)}
                                className="text-[9px] font-bold px-2 py-1 rounded bg-slate-800 text-slate-300 hover:bg-slate-700 transition-colors"
                              >
                                Éditer
                              </button>
                            )}
                            <button 
                              onClick={() => toggleUserStatus(userKey)}
                              className={`text-[9px] font-bold px-2 py-1 rounded transition-colors ${u.status === 'Actif' ? 'bg-red-500/10 text-red-500 hover:bg-red-500/20' : 'bg-emerald-500/10 text-emerald-500 hover:bg-emerald-500/20'}`}
                            >
                              {u.status === 'Actif' ? 'Bloquer' : 'Activer'}
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

              {/* Dynamic Information Cards */}
              <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div className="bg-gradient-to-br from-gray-900 to-gray-850 p-5 rounded-2xl border border-gray-800 shadow-md flex flex-col justify-between">
                  <div className="flex justify-between items-center mb-2">
                    <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Masse Monétaire FC</span>
                    <Coins className="w-5 h-5 text-yellow-500" />
                  </div>
                  <div>
                    <h3 className="text-2xl font-black text-white">
                      {Object.values(users).reduce((acc, curr) => acc + (curr.balanceFC || 0), 0).toLocaleString()} <span className="text-xs font-normal text-slate-400">FC</span>
                    </h3>
                    <p className="text-[10px] text-slate-500 mt-1">Total CDF circulant sur l'écosystème cloud</p>
                  </div>
                </div>

                <div className="bg-gradient-to-br from-gray-900 to-gray-850 p-5 rounded-2xl border border-gray-800 shadow-md flex flex-col justify-between">
                  <div className="flex justify-between items-center mb-2">
                    <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Masse Monétaire USD</span>
                    <DollarSign className="w-5 h-5 text-emerald-500" />
                  </div>
                  <div>
                    <h3 className="text-2xl font-black text-emerald-400">
                      {Object.values(users).reduce((acc, curr) => acc + (curr.balanceUSD || 0), 0).toLocaleString()} <span className="text-xs font-normal text-slate-400">$</span>
                    </h3>
                    <p className="text-[10px] text-slate-500 mt-1">Total Dollars US circulant sur l'écosystème cloud</p>
                  </div>
                </div>

                <div className="bg-gradient-to-br from-gray-900 to-gray-850 p-5 rounded-2xl border border-gray-800 shadow-md flex flex-col justify-between">
                  <div className="flex justify-between items-center mb-2">
                    <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Commissions cumulées FC</span>
                    <TrendingUp className="w-5 h-5 text-yellow-500" />
                  </div>
                  <div>
                    <h3 className="text-2xl font-black text-white">
                      {(((users.tresor?.commissionFC || 0) + (users.superAgent?.commissionFC || 0) + (users.agent?.commissionFC || 0))).toLocaleString()} <span className="text-xs font-normal text-slate-400">FC</span>
                    </h3>
                    <p className="text-[10px] text-slate-500 mt-1">Total des gains de service accumulés en Francs</p>
                  </div>
                </div>

                <div className="bg-gradient-to-br from-gray-900 to-gray-850 p-5 rounded-2xl border border-gray-800 shadow-md flex flex-col justify-between">
                  <div className="flex justify-between items-center mb-2">
                    <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Commissions cumulées USD</span>
                    <TrendingUp className="w-5 h-5 text-emerald-400" />
                  </div>
                  <div>
                    <h3 className="text-2xl font-black text-emerald-400">
                      {(((users.tresor?.commissionUSD || 0) + (users.superAgent?.commissionUSD || 0) + (users.agent?.commissionUSD || 0))).toLocaleString()} <span className="text-xs font-normal text-slate-400">$</span>
                    </h3>
                    <p className="text-[10px] text-slate-500 mt-1">Total des gains de service accumulés en Dollars</p>
                  </div>
                </div>
              </div>

              {/* Regulation and Financial Directives Panel */}
              <div className="bg-gray-900 p-6 rounded-2xl border border-gray-800">
                <h2 className="text-lg font-bold text-white mb-4 flex items-center gap-2">
                  <Landmark className="w-5 h-5 text-yellow-500" /> Régulation & Frappe Monétaire Cloud (BCC / Banikilabs)
                </h2>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-black p-4 rounded-xl border border-gray-800">
                    <p className="text-xs font-semibold text-slate-300 mb-1">Injecter capital dans le Trésor</p>
                    <p className="text-[11px] text-slate-500 mb-3">Saisir de nouvelles devises virtuelles maîtresses dans les coffres régulateurs.</p>
                    <div className="flex gap-1.5">
                      <button 
                        onClick={() => handleTresorMintMoney(5000000, 'FC', '9999')}

// Integrated Interactive Phone Frame
function PhoneFrame({ userKey, user, phoneState, setPhoneStates, children, isSelected, onSelect, transactions }) {
  
  const toggleLocalHistory = (e) => {
    e.stopPropagation();
    const targetScreen = phoneState.screen === 'local_history' ? 'home' : 'local_history';
    setPhoneStates(prev => ({
      ...prev,
      [userKey]: { ...prev[userKey], screen: targetScreen }
    }));
  };

  return (
    <div 
      onClick={onSelect}
      className={`relative mx-auto w-full max-w-[270px] h-[550px] rounded-[36px] bg-slate-900 border-4 ${isSelected ? 'border-red-500 shadow-xl shadow-red-950/30' : 'border-slate-800'} overflow-hidden flex flex-col transition-all cursor-pointer`}
    > 
      {/* Notch */}
      <div className="absolute top-2 left-1/2 transform -translate-x-1/2 w-28 h-4 bg-black rounded-full z-30 flex items-center justify-center">
        <div className="w-2.5 h-2.5 rounded-full bg-slate-850 ml-auto mr-1.5"></div>
      </div>

      {/* Simulator Bar */}
      <div className="h-7 bg-slate-950 px-4 pt-1.5 flex justify-between items-center text-[9px] text-slate-400 font-semibold select-none z-20">
        <span>12:45</span>
        <div className="flex items-center space-x-1"> 
          <span className="text-[7px] bg-red-600 px-1 rounded text-white font-extrabold">Voda RDC</span>
          <span className="w-3 h-1.5 bg-slate-700 rounded-sm relative">
            <span className="absolute top-0.5 left-0.5 bottom-0.5 right-0.5 bg-emerald-400 rounded-sm"></span>
          </span>
        </div>
      </div>

      {/* Push Notification Banner */}
      {phoneState?.notification && (
        <div className="absolute top-8 left-2 right-2 bg-black/95 text-white p-2 rounded-xl border border-yellow-500/30 shadow-lg z-50 text-[10px] leading-snug flex items-start gap-1.5 animate-bounce">
          <div className="bg-yellow-500 rounded p-0.5 text-black">
            <Bell className="w-3 h-3" />
          </div>
          <div className="flex-1">
            <div className="flex justify-between font-bold text-yellow-400 mb-0.5 text-[8px]">
              <span>M-PESA INSTANTANÉ</span>
              <span>Maintenant</span>
            </div>
            <p className="font-medium text-slate-200 text-[9px]">{phoneState.notification.text}</p>
          </div>
        </div>
      )}

      {/* M-Pesa Workspace screen */}
      <div className="flex-1 bg-black flex flex-col overflow-y-auto relative z-10">
        
        {/* App Bar */}
        <div className="bg-yellow-500 text-black p-3 pt-1 flex flex-col shadow-md">
          <div className="flex items-center justify-between mb-1">
            <span className="font-black text-xs tracking-wider">m-pesa</span>
            <div className="flex items-center gap-2">
              <button 
                onClick={toggleLocalHistory}
                className="p-1 rounded bg-black/20 hover:bg-black/40 text-white transition-colors flex items-center justify-center"
                title="Consulter mon historique"
              >
                <History className="w-3.5 h-3.5" />
              </button>
              <span className="text-[8px] bg-black/30 px-1.5 py-0.5 rounded-full text-slate-200">
                {user.role === 'tresor' ? 'Régulateur' : user.role === 'superAgent' ? 'SuperAgent' : user.role === 'agent' ? 'Agent' : user.role === 'merchant' ? 'Marchand' : 'Client'} 
              </span>
            </div>
          </div>
          <div className="flex items-center space-x-1.5">
            <div className="w-5.5 h-5.5 rounded-full bg-white/20 flex items-center justify-center font-bold text-[10px]">
              {user.name ? user.name.charAt(0) : 'U'}
            </div>
            <div className="overflow-hidden">
              <h4 className="text-[10px] font-bold leading-tight truncate">{user.name}</h4> 
              <p className="text-[8px] text-red-200">{user.phone}</p>
            </div>
          </div>
        </div>

        {/* Dynamic Display Layout */}
        <div className="flex-1 p-2 flex flex-col text-slate-100">
          {phoneState.screen === 'local_history' ? (
            <LocalHistoryScreen 
              user={user} 
              transactions={transactions} 
              onClose={() => setPhoneStates(prev => ({ ...prev, [userKey]: { ...prev[userKey], screen: 'home' } }))} 
            />
          ) : (
            children
          )}
        </div>

      </div>

      {/* Interactive Home Indicator Bar */}
      <div className="h-4 bg-slate-950 flex items-center justify-center z-20">
        <button 
          onClick={(e) => {
            e.stopPropagation();
            setPhoneStates(prev => ({
              ...prev,
              [userKey]: { ...prev[userKey], screen: 'home', error: '' }
            }));
          }}
          className="w-16 h-1 bg-slate-700 rounded-full hover:bg-slate-500 transition-all"
        ></button>
      </div>
    </div>
  );
}

// Local Transaction logs for a specific phone terminal
function LocalHistoryScreen({ user, transactions, onClose }) {
  const myTx = transactions.filter(tx => 
    tx.sender === user.name || tx.receiver === user.name
  );

  return (
    <div className="flex flex-col flex-1 text-[11px]">
      <div className="flex justify-between items-center border-b border-slate-800 pb-1.5 mb-2">
        <h3 className="font-bold text-red-400 flex items-center gap-1">
          <History className="w-3.5 h-3.5" /> Mon Historique 
        </h3>
        <button onClick={onClose} className="text-[9px] bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded">
          Fermer
        </button>
      </div>

      <div className="flex-1 overflow-y-auto space-y-1.5 pr-0.5">
        {myTx.length === 0 ? (
          <p className="text-center text-slate-500 text-[10px] py-8">Aucune transaction enregistrée pour ce compte.</p>
        ) : (
          myTx.map((tx, idx) => {
            const isSender = tx.sender === user.name;
            return (
              <div key={idx} className="bg-slate-900 p-2 rounded border border-slate-800 flex justify-between items-center">
                <div className="overflow-hidden flex-1 mr-1"> 
                  <p className="font-bold text-[10px] truncate">
                    {tx.type === 'MINT_MONNAIE' ? 'Création de Float' : isSender ? `Vers: ${tx.receiver}` : `De: ${tx.sender}`}
                  </p>
                  <p className="text-[8px] text-slate-400">{tx.date}</p>
                </div>
                <div className="text-right">
                  <p className={`font-extrabold ${isSender ? 'text-red-400' : 'text-emerald-400'}`}>
                    {isSender ? '-' : '+'}{(tx.amount || 0).toLocaleString()} {tx.currency} 
                  </p>
                  <span className="text-[7px] bg-slate-800 px-1 rounded text-slate-300">{tx.id}</span>
                </div>
              </div>
            );
          })
        )}
      </div>
    </div>
  );
}

// SCREEN 1: VODACOM TREASURY APP
function TresorAppScreen({ user, phoneState, setPhoneStates, onMintMoney, onSupplySuperAgent, superAgentName }) {

          </div>
        </div>

        <div>
          <label className="text-[9px] text-slate-500 block mb-1">Montant Réel Retiré</label>
          <input 
            type="number" 
            value={localAmount}
            onChange={(e) => setLocalAmount(e.target.value)}
            className="w-full bg-slate-900 border border-slate-800 p-2 rounded text-white focus:outline-none"
          />
        </div>

        <div>
          <label className="text-[9px] text-slate-500 block mb-1">Votre PIN Agent</label>
          <input 
            type="password" 
            maxLength={4}
            value={localPin}
            onChange={(e) => setLocalPin(e.target.value)}
            className="w-full bg-slate-900 border border-slate-800 p-2 rounded text-center tracking-widest focus:outline-none"
          />
        </div>

        {errorMsg && <p className="text-[9px] text-red-400 bg-red-500/10 p-1.5 rounded">{errorMsg}</p>}
        {successMsg && <p className="text-[9px] text-emerald-400 bg-emerald-500/10 p-1.5 rounded">{successMsg}</p>}

        <div className="grid grid-cols-2 gap-2 mt-auto">
          <button onClick={() => handleAction('home')} className="bg-gray-900 p-2 rounded border border-gray-800">Retour</button>
          <button onClick={submitCashOut} className="bg-amber-600 font-bold p-2 rounded">Retirer Float</button> 
        </div>
      </div>
    );
  }
}

// SCREEN 4: VODACOM REGISTERED MERCHANT APP
function MerchantAppScreen({ user, phoneState, setPhoneStates, transactions }) {
  const merchantSales = transactions.filter(t => t.type === 'PAIEMENT_MARCHAND' && t.receiver === user.name);

  return (
    <div className="flex flex-col flex-1 text-[11px]">
      
      <div className="bg-gray-900 border border-gray-800 p-2.5 rounded-xl mb-3">
        <p className="text-[9px] text-slate-400 font-bold uppercase tracking-wider text-center">Portefeuille de Ventes</p>
        <div className="grid grid-cols-2 gap-1 mt-1.5">
          <div className="bg-black p-1 rounded border border-gray-850 text-center">
            <span className="text-[8px] text-yellow-400 font-bold">SOLDE CDF</span>
            <p className="font-extrabold text-[12px] truncate">{(user.balanceFC || 0).toLocaleString()} FC</p>
          </div>
          <div className="bg-black p-1 rounded border border-gray-850 text-center">
            <span className="text-[8px] text-emerald-400 font-bold">SOLDE USD</span> 
            <p className="font-extrabold text-[12px] truncate">{(user.balanceUSD || 0).toLocaleString()} $</p>
          </div>
        </div>
      </div>

      <div className="bg-slate-900 border border-slate-800 p-2.5 rounded-xl mb-3 flex flex-col items-center justify-center">
        <p className="text-[9px] text-slate-400 mb-0.5 font-bold">CODE MARCHAND UNIQUE</p>
        <div className="bg-white text-black font-black px-4 py-1 rounded text-base tracking-widest font-mono shadow-inner">
          {user.merchantCode}
        </div>
        <div className="flex items-center gap-1 mt-1 text-[8px] text-slate-400">
          <QrCode className="w-3 h-3 text-yellow-500" />
          <span>Scanner pour régler la facture</span>
        </div>
      </div>

      <h3 className="text-[9px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 flex justify-between">
        <span>Ventes Récentes</span>
        <span className="bg-slate-800 text-slate-300 px-1.5 rounded">{merchantSales.length}</span>
      </h3>

      <div className="flex-1 overflow-y-auto max-h-[140px] space-y-1.5 pr-0.5">
        {merchantSales.length === 0 ? (
          <div className="h-full flex items-center justify-center text-center text-slate-500 text-[9px] py-4">
            Aucun achat enregistré.<br />Initiez un paiement marchand depuis un client.
          </div>
        ) : (
          merchantSales.map((sale, idx) => (
            <div key={idx} className="bg-slate-900 p-2 rounded border border-slate-850 flex justify-between items-center text-[10px]">
              <div>
                <p className="font-bold text-slate-200 truncate max-w-[90px]">{sale.sender}</p>
                <p className="text-[7px] text-slate-500">{sale.date}</p>
              </div>
              <div className="text-right">
                <p className="font-extrabold text-emerald-400">+{(sale.amount || 0).toLocaleString()} {sale.currency}</p>
                <p className="text-[7px] text-slate-500">Net après commission (0.5%)</p>
              </div>
            </div>
          ))
        )}
      </div>

      <div className="bg-slate-900/40 border border-slate-850 p-2 rounded text-[8px] text-slate-500 mt-2">
        Les frais marchands sont de 0.5%, reversés à l'écosystème d'agents et au régulateur Trésor.
      </div>

    </div>
  );
}

// SCREEN 5 & 6: VODACOM STANDARD CLIENTS APP
function ClientAppScreen({ userKey, user, receiverUser, receiverKey, phoneState, setPhoneStates, merchantCode, onSendMoney, onPayMerchant }) {
  const [localAmount, setLocalAmount] = useState('');
  const [localCurrency, setLocalCurrency] = useState('FC');
  const [localTarget, setLocalTarget] = useState('');
  const [localPin, setLocalPin] = useState('');
  const [errorMsg, setErrorMsg] = useState('');
  const [successMsg, setSuccessMsg] = useState('');

  const resetForm = () => {
    setLocalAmount('');
    setLocalTarget('');
    setLocalPin('');
    setErrorMsg('');
    setSuccessMsg('');
  };

  const handleAction = (screen) => {
    resetForm();
    setPhoneStates(prev => ({
      ...prev,
      [userKey]: { ...prev[userKey], screen }
    }));
  };

  const submitSend = async () => {
    if (localTarget !== receiverUser.phone) {
      setErrorMsg("Numéro de destinataire incorrect pour ce test.");
      return;
    }
    const res = await onSendMoney(receiverKey, localAmount, localCurrency, localPin);
    if (res.success) {
      setSuccessMsg("Envoi effectué avec succès !");
      setTimeout(() => handleAction('home'), 2000);
    } else {
      setErrorMsg(res.msg);
    }
  };

  const submitPayMerchant = async () => {
    if (localTarget !== merchantCode) {
      setErrorMsg("Code Marchand incorrect.");
      return;
    }
    const res = await onPayMerchant(localTarget, localAmount, localCurrency, localPin);
    if (res.success) {
      setSuccessMsg("Paiement Marchand approuvé !");
      setTimeout(() => handleAction('home'), 2000);
    } else {
      setErrorMsg(res.msg);
    }
  };

  if (phoneState.screen === 'home') {
    return (
      <div className="flex flex-col flex-1 text-[11px]">
        <div className="bg-gray-900 border border-gray-800 p-2.5 rounded-xl mb-3">
          <p className="text-[9px] text-slate-400 font-bold uppercase tracking-wider text-center">Mes Comptes M-Pesa</p>
          <div className="grid grid-cols-2 gap-1 mt-1.5">
            <div className="bg-black p-1 rounded border border-gray-800 text-center">
              <span className="text-[8px] text-yellow-400 font-bold">SOLDE CDF</span>
              <p className="font-extrabold text-[12px] truncate">{(user.balanceFC || 0).toLocaleString()} FC</p>
            </div>
            <div className="bg-black p-1 rounded border border-gray-800 text-center">
              <span className="text-[8px] text-emerald-400 font-bold">SOLDE USD</span> 
              <p className="font-extrabold text-[12px] truncate">{(user.balanceUSD || 0).toLocaleString()} $</p>
            </div>
          </div>
        </div>

        <div className="grid grid-cols-2 gap-1.5 mb-3">
          <button 
            onClick={() => handleAction('send')}
            className="p-2.5 bg-gray-900 border border-gray-800 rounded-xl hover:bg-gray-800 transition-colors flex flex-col items-center justify-center gap-1 text-center"
          >
            <Send className="w-4 h-4 text-red-500" />
            <span className="font-semibold text-slate-300">Envoi d'Argent</span>
          </button>

          <button 
            onClick={() => handleAction('payMerchant')}
            className="p-2.5 bg-gray-900 border border-gray-800 rounded-xl hover:bg-gray-800 transition-colors flex flex-col items-center justify-center gap-1 text-center"
          >
            <ShoppingBag className="w-4 h-4 text-yellow-500" />
            <span className="font-semibold text-slate-300">Payer Marchand</span>
          </button>
        </div>

        <div className="bg-slate-900/55 border border-slate-850 p-2 rounded text-[8px] text-slate-400 mt-auto">
          <span className="font-bold text-slate-300 block mb-0.5">ℹ️ Guide de Simulation :</span>
          <p>Destinataire : <span className="text-white font-mono">{receiverUser.phone}</span> ({receiverUser.name})</p>
          <p className="mt-0.5">Marchand code : <span className="text-white font-mono">{merchantCode}</span></p>
          <p className="mt-0.5">PIN d'opération : <span className="text-white font-mono">{user.code}</span></p>
        </div>
      </div>
    );
  }

  if (phoneState.screen === 'send') {
    return (
      <div className="flex flex-col flex-1 gap-2 text-[11px]">
        <h3 className="font-bold text-gray-300 flex items-center gap-1">
          <Send className="w-3.5 h-3.5 text-red-500" /> Envoi d'argent instantané
        </h3>

        <div>
          <label className="text-[9px] text-slate-500 block mb-0.5">Téléphone Bénéficiaire</label>
          <input 
            type="text" 
            placeholder="+243..."
            value={localTarget}
            onChange={(e) => setLocalTarget(e.target.value)}
            className="w-full bg-slate-900 border border-slate-800 p-1.5 rounded text-white font-mono focus:outline-none"
          />
          <button 
            onClick={() => setLocalTarget(receiverUser.phone)} 
            className="text-[8px] text-indigo-400 font-bold mt-0.5 block hover:underline"
          >
            Saisir le numéro de {receiverUser.name}
          </button>
        </div>

        <div>
          <label className="text-[9px] text-slate-500 block mb-0.5">Devise</label>
          <div className="grid grid-cols-2 gap-1">
            <button 
              onClick={() => setLocalCurrency('FC')} 
              className={`py-1 rounded font-bold ${localCurrency === 'FC' ? 'bg-yellow-500 text-black' : 'bg-gray-900 text-gray-400'}`}
            >
              CDF (FC)
            </button>
            <button 
              onClick={() => setLocalCurrency('USD')} 
              className={`py-1 rounded font-bold ${localCurrency === 'USD' ? 'bg-emerald-600 text-white' : 'bg-slate-900 text-slate-400'}`}
            >
              USD ($)
            </button>
          </div>
        </div>

        <div>
          <label className="text-[9px] text-slate-500 block mb-1">Montant à transférer</label>
          <input 
            type="number" 
            value={localAmount}
            onChange={(e) => setLocalAmount(e.target.value)}
            className="w-full bg-slate-900 border border-slate-800 p-1.5 rounded text-white focus:outline-none"
          />
        </div>

        <div>
          <label className="text-[9px] text-slate-500 block mb-1">Code PIN (4 chiffres)</label>
          <input 
            type="password" 
            maxLength={4}
            value={localPin}
            onChange={(e) => setLocalPin(e.target.value)}
            className="w-full bg-slate-900 border border-slate-800 p-1.5 rounded text-center tracking-widest focus:outline-none"
          />
        </div>

        {errorMsg && <p className="text-[9px] text-red-400 bg-red-500/10 p-1 rounded">{errorMsg}</p>}
        {successMsg && <p className="text-[9px] text-emerald-400 bg-emerald-500/10 p-1 rounded">{successMsg}</p>}

        <div className="grid grid-cols-2 gap-2 mt-auto">
          <button onClick={() => handleAction('home')} className="bg-gray-900 p-1.5 rounded border border-gray-800">Retour</button>
          <button onClick={submitSend} className="bg-yellow-500 font-bold p-1.5 rounded text-black">Confirmer</button>
        </div>
      </div>
    );
  }

  if (phoneState.screen === 'payMerchant') {
    return (
      <div className="flex flex-col flex-1 gap-2 text-[11px]">
        <h3 className="font-bold text-gray-300 flex items-center gap-1">
          <ShoppingBag className="w-3.5 h-3.5 text-yellow-500" /> Payer un Marchand M-Pesa
        </h3>

        <div>
          <label className="text-[9px] text-slate-500 block mb-0.5">Code Marchand (6 chiffres)</label>
          <input 
            type="text" 
            maxLength={6}
            value={localTarget}
            onChange={(e) => setLocalTarget(e.target.value)}
            className="w-full bg-slate-900 border border-slate-800 p-1.5 rounded text-white font-mono text-center focus:outline-none"
          />
          <button 
            onClick={() => setLocalTarget(merchantCode)} 
            className="text-[8px] text-yellow-500 font-bold mt-0.5 block hover:underline"
          >
            Saisir le code {merchantCode}
          </button>
        </div>

        <div>
          <label className="text-[9px] text-slate-500 block mb-0.5">Devise</label>
          <div className="grid grid-cols-2 gap-1">
            <button 
              onClick={() => setLocalCurrency('FC')} 
              className={`py-1 rounded font-bold ${localCurrency === 'FC' ? 'bg-yellow-500 text-black' : 'bg-gray-900 text-gray-400'}`}
            >
              CDF (FC)
            </button>
            <button 
              onClick={() => setLocalCurrency('USD')} 
              className={`py-1 rounded font-bold ${localCurrency === 'USD' ? 'bg-emerald-600 text-white' : 'bg-slate-900 text-slate-400'}`}
            >
              USD ($)
            </button>
          </div>
        </div>

        <div>
          <label className="text-[9px] text-slate-500 block mb-1">Montant de l'Achat</label>
          <input 
            type="number" 
            value={localAmount}
            onChange={(e) => setLocalAmount(e.target.value)}
            className="w-full bg-slate-900 border border-slate-800 p-1.5 rounded text-white focus:outline-none"
          />
        </div>

        <div>
          <label className="text-[9px] text-slate-500 block mb-1">Code PIN M-Pesa</label>
          <input 
            type="password" 
            maxLength={4}
            value={localPin}
            onChange={(e) => setLocalPin(e.target.value)}
            className="w-full bg-slate-900 border border-slate-800 p-1.5 rounded text-center tracking-widest focus:outline-none"
          />
        </div>

        {errorMsg && <p className="text-[9px] text-red-400 bg-red-500/10 p-1 rounded">{errorMsg}</p>}
        {successMsg && <p className="text-[9px] text-emerald-400 bg-emerald-500/10 p-1 rounded">{successMsg}</p>}

        <div className="grid grid-cols-2 gap-2 mt-auto">
          <button onClick={() => handleAction('home')} className="bg-gray-900 p-1.5 rounded border border-gray-800">Retour</button>
          <button onClick={submitPayMerchant} className="bg-yellow-500 font-bold p-1.5 rounded text-black">Régler</button>
        </div>
      </div>
    );
  }
}

// REGISTER ACCOUNT SCREEN COMPONENT
function RegisterScreen({ onRegister, onCancel }) {
  const [name, setName] = useState('');
  const [phone, setPhone] = useState('');
  const [pin, setPin] = useState('');
  const [error, setError] = useState('');

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!name || !phone || !pin) {
      setError("Veuillez remplir tous les champs.");
      return;
    }
    if (pin.length !== 4 || isNaN(pin)) {
      setError("Le code PIN doit être composé de 4 chiffres.");
      return;
    }
    onRegister({ name, phone, pin });
  };

  return (
    <div className="max-w-md mx-auto w-full bg-gray-900 rounded-2xl border border-gray-800 p-6 my-8">
      <h2 className="text-xl font-bold text-white mb-2 flex items-center gap-2">
        <PlusCircle className="w-6 h-6 text-yellow-500" /> Ouvrir un Compte Client M-Pesa
      </h2>
      <p className="text-xs text-slate-400 mb-6">Enregistrez un nouveau portefeuille client sur la base de données cloud.</p>

      <form onSubmit={handleSubmit} className="space-y-4">
        <div>
          <label className="text-xs text-slate-300 block mb-1 font-semibold">Nom Complet</label>
          <input 
            type="text" 
            placeholder="Ex: Patient Mwamba"
            value={name}
            onChange={e => setName(e.target.value)}
            className="w-full bg-black border border-gray-800 focus:border-yellow-500 outline-none p-3 rounded-xl text-sm"
          />
        </div>

        <div>
          <label className="text-xs text-slate-300 block mb-1 font-semibold">Numéro de Téléphone (Unique)</label>
          <input 
            type="text" 
            placeholder="Ex: +243 812 000 111"
            value={phone}
            onChange={e => setPhone(e.target.value)}
            className="w-full bg-black border border-gray-800 focus:border-yellow-500 outline-none p-3 rounded-xl text-sm font-mono"
          />
        </div>

        <div>
          <label className="text-xs text-slate-300 block mb-1 font-semibold">Code PIN secret (4 chiffres)</label>
          <input 
            type="password" 
            maxLength={4}
            placeholder="****"
            value={pin}
            onChange={e => setPin(e.target.value)}
            className="w-full bg-black border border-gray-800 focus:border-yellow-500 outline-none p-3 rounded-xl text-center text-sm tracking-widest font-mono"
          />
        </div>

        {error && <p className="text-xs text-red-400 bg-red-500/10 p-2.5 rounded-lg border border-red-500/20">{error}</p>}

        <div className="flex gap-3 pt-4">
          <button 
            type="button" 
            onClick={onCancel}
            className="flex-1 py-3 border border-gray-800 hover:bg-slate-800 rounded-xl text-sm font-semibold transition-colors text-slate-400"
          >
            Annuler
          </button>
          <button 
            type="submit" 
            className="flex-1 py-3 bg-yellow-500 hover:bg-yellow-400 text-black rounded-xl text-sm font-bold transition-all shadow-md shadow-yellow-500/10"
          >
            Enregistrer le compte
          </button>
        </div>
      </form>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
</body>
</html>
